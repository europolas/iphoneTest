name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'DemoApp/**'
      - 'project.yml'
      - '.github/workflows/build-ios.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iPhone app
        run: |
          xcodebuild \
            -project DemoApp.xcodeproj \
            -scheme DemoApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA for local signing
        run: |
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/DemoApp.app package/Payload/
          cd package
          zip -r ../DemoApp-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DemoApp-unsigned
          path: DemoApp-unsigned.ipa
          if-no-files-found: error
          retention-days: 3
